# T01: compile and test the engine on Linux and Windows.
# The SDK comes from global.json (10.0.404, rollForward latestPatch).
# Martis.Game is not part of the solution. Godot.NET.Sdk builds it on Linux without
# the Godot editor (ADR-017); the headless smoke run needs Godot and stays local.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # setup-dotnet cache: true reads and writes the Actions cache.
  actions: write

jobs:
  build-test:
    name: Compilar y probar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # testhost 18.12.0 prints a misleading "outdated Test.Sdk" line when this
      # variable is absent. The package is current; the variable only selects
      # where collector artifacts would be staged.
      VSTEST_ARTIFACTS_DIRECTORY: ${{ github.workspace }}/TestResults/vstest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Instalar el SDK indicado por global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # The action only auto-detects packages.lock.json in the repo root.
          # Per-project lock files are the cache key.
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Mostrar la versión del SDK
        run: dotnet --version

      - name: Restaurar
        run: dotnet restore MARTIS.sln --locked-mode

      # `restore --locked-mode` recreates a missing packages.lock.json on SDK 10.0.404.
      # diff catches edits to tracked locks. status catches locks that were never indexed.
      # `git status` itself exits 0 when the tree is dirty, so a non-empty status fails the step.
      - name: El restore no cambia los lockfiles
        shell: bash
        run: |
          set +e
          git diff --exit-code -- '**/packages.lock.json'
          diff_status=$?
          status=$(git status --porcelain -- '**/packages.lock.json')
          set -e
          if [ "$diff_status" -ne 0 ] || [ -n "$status" ]; then
            git status --porcelain -- '**/packages.lock.json'
            echo "packages.lock.json cambió o no está en el índice."
            exit 1
          fi

      - name: Compilar
        run: dotnet build MARTIS.sln -c Release --no-restore

      - name: Probar
        run: dotnet test MARTIS.sln -c Release --no-build

      - name: Compilar el juego Godot (Godot.NET.Sdk, sin editor)
        if: runner.os == 'Linux'
        run: dotnet build src/Martis.Game/Martis.Game.csproj -c Release
